services:
  node:
    image: ghcr.io/arsamnikzaad/manubisguard-node:feature-amnezia-wg
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manubisguard-node
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      SERVICE_PORT: 62050
      SERVICE_PROTOCOL: "grpc"
      PG_NODE_WG_HOST_ROUTING: "1"
      SSL_CERT_FILE: "/var/lib/pg-node/certs/ssl_cert.pem"
      SSL_KEY_FILE: "/var/lib/pg-node/certs/ssl_key.pem"
      GENERATED_CONFIG_PATH: "/var/lib/pg-node/generated"
    volumes:
      - /var/lib/pg-node:/var/lib/pg-node
