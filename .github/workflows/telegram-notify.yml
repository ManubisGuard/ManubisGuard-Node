name: Telegram Push Notify

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build commit list
        id: commits
        run: |
          COUNT=$(echo '${{ toJson(github.event.commits) }}' | jq 'length')
          LIST=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[] | "• \(.id[0:7]) — \(.message | split("\n")[0])"' | head -n 10)
          {
            echo "count=$COUNT"
            echo "list<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        run: |
          TEXT="📝 ${{ steps.commits.outputs.count }} new commit(s)

          📦 Repository: ${{ github.repository }}
          🌿 Branch: ${{ github.ref_name }}
          👤 Pusher: @${{ github.actor }}

          ${{ steps.commits.outputs.list }}

          Compare: ${{ github.event.compare }}"

          PAYLOAD=$(jq -n \
            --arg chat_id "${{ secrets.TELEGRAM_TO }}" \
            --arg thread_id "${{ secrets.TELEGRAM_THREAD_ID }}" \
            --arg text "$TEXT" \
            '{chat_id: $chat_id, text: $text} + (if $thread_id != "" then {message_thread_id: ($thread_id | tonumber)} else {} end)')

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
            
