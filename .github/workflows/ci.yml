name: CI

on:
  push:
    branches: ["main", "feature/amnezia-wg"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test ./backend/wireguard ./cmd/node -v -p 1
      - run: go build ./cmd/node
